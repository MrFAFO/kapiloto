name: Provider Spike

on:
  workflow_dispatch:
    inputs:
      provider:
        description: Provider to probe
        required: true
        default: both
        type: choice
        options:
          - both
          - api-football
          - sportmonks
      concurrency:
        description: Fixture probe concurrency
        required: true
        default: "2"
        type: string

permissions:
  contents: read

jobs:
  spike:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: provider-readonly
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Typecheck provider spike
        run: npm run typecheck

      - name: Test provider adapters
        run: npm run test:providers

      - name: Prepare artifact directory
        run: mkdir -p artifacts/provider-spike

      - name: Probe API-Football
        if: ${{ inputs.provider == 'both' || inputs.provider == 'api-football' }}
        env:
          API_FOOTBALL_API_KEY: ${{ secrets.API_FOOTBALL_API_KEY }}
        run: |
          npm run spike:provider -- \
            --provider api-football \
            --input scripts/provider-spike.round-264101.json \
            --out artifacts/provider-spike/api-football.json \
            --concurrency "${{ inputs.concurrency || '2' }}"

      - name: Probe Sportmonks
        if: ${{ inputs.provider == 'both' || inputs.provider == 'sportmonks' }}
        env:
          SPORTMONKS_API_TOKEN: ${{ secrets.SPORTMONKS_API_TOKEN }}
        run: |
          npm run spike:provider -- \
            --provider sportmonks \
            --input scripts/provider-spike.round-264101.json \
            --out artifacts/provider-spike/sportmonks.json \
            --concurrency "${{ inputs.concurrency || '2' }}"

      - name: Compare providers
        if: ${{ inputs.provider == 'both' }}
        run: |
          npm run spike:compare -- \
            --left artifacts/provider-spike/api-football.json \
            --right artifacts/provider-spike/sportmonks.json \
            > artifacts/provider-spike/comparison.json

      - name: Print reports
        if: always()
        run: |
          for file in artifacts/provider-spike/*.json; do
            if [ -f "$file" ]; then
              echo "===== $file ====="
              cat "$file"
            fi
          done

      - name: Upload spike reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: provider-spike-264101
          path: artifacts/provider-spike
          if-no-files-found: error
          retention-days: 1
