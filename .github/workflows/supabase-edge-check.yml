name: Supabase Edge Check

on:
  push:
    branches:
      - design/mobile-first-dark-stadium
    paths:
      - "supabase/functions/kapiloto-live-sync/**"
      - ".github/workflows/supabase-edge-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Typecheck live sync edge function
        run: deno check supabase/functions/kapiloto-live-sync/index.ts
