name: A2-A materialize and validate
permissions:
  contents: write
on:
  push:
    branches:
      - feat/v4-match-ledger-provider-ingest-a2a-validation
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Materialize full migration
        env:
          MIGRATION_GZIP_B64: 
        run: |
          python - <<'PY'
          import os, base64, gzip, pathlib
          data = gzip.decompress(base64.b64decode(os.environ["MIGRATION_GZIP_B64"]))
          p = pathlib.Path("supabase/migrations/20261029231924_kapiloto_v4_provider_ingest.sql")
          p.write_bytes(data)
          print(len(data), data.count(b"\n") + 1)
          PY
      - name: Publish materialized tree to temp branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/migrations/20261029231924_kapiloto_v4_provider_ingest.sql
          git commit -m "test: materialize full a2a migration"
          git push --force origin HEAD:refs/heads/feat/v4-match-ledger-provider-ingest-a2a-materialized
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run typecheck
      - run: npm run test:kapiloto-v4
      - run: npm run test:kapiloto
      - run: npm run test:research-v2
      - run: npm test
      - name: Turbopack build attempt
        id: turbo
        continue-on-error: true
        run: npm run build
      - name: Webpack fallback
        if: steps.turbo.outcome == 'failure'
        run: npx next build --webpack
