name: 365Scores Results Preflight

on:
  workflow_dispatch:
  push:
    branches:
      - design/mobile-first-dark-stadium
    paths:
      - ".github/workflows/scores365-results-preflight.yml"
      - "scripts/scores365-results-preflight.mjs"

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify 365Scores results endpoint
        run: node scripts/scores365-results-preflight.mjs
