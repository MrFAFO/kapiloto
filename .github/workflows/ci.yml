name: CI

on:
  push:
    branches:
      - main
      - feat/**
  pull_request:
    branches:
      - main
      - feat/**

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Typecheck
        run: npm run typecheck

      - name: Provider tests
        run: npm run test:providers

      - name: V4 A2-B pilot tests
        run: npx tsx --test lib/kapiloto-v4/sportmonks-pilot.test.ts

      - name: Football feature tests
        run: npm run test:features

      - name: Round import tests
        run: npm run test:rounds

      - name: Ticket persistence tests
        run: npm run test:tickets

      - name: Group flow tests
        run: npm run test:groups

      - name: Kapiloto core tests
        run: npm run test:kapiloto

      - name: Auth tests
        run: npm run test:auth

      - name: UI tests
        run: npm run test:ui

      - name: Build
        run: npm run build
