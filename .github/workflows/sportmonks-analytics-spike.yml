name: Sportmonks Analytics Spike

on:
  push:
    branches:
      - design/mobile-first-dark-stadium
    paths:
      - .github/sportmonks-analytics-trigger

jobs:
  spike:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Typecheck
        run: npm run typecheck

      - name: Test provider adapters
        run: npm run test:providers

      - name: Prepare artifacts
        run: mkdir -p artifacts/provider-spike

      - name: Probe Sportmonks
        env:
          SPORTMONKS_API_TOKEN: ${{ secrets.SPORTMONKS_API_TOKEN }}
        run: |
          npm run spike:provider -- \
            --provider sportmonks \
            --input scripts/provider-spike.round-264101.json \
            --out artifacts/provider-spike/sportmonks.json \
            --concurrency 2

      - name: Diagnose entitled leagues and date fixtures
        env:
          SPORTMONKS_API_TOKEN: ${{ secrets.SPORTMONKS_API_TOKEN }}
        run: |
          node <<'NODE'
          const token = process.env.SPORTMONKS_API_TOKEN;
          const base = "https://api.sportmonks.com/v3/football";
          async function get(path, params = {}) {
            const url = new URL(base + path);
            url.searchParams.set("api_token", token);
            for (const [k,v] of Object.entries(params)) url.searchParams.set(k, String(v));
            const res = await fetch(url);
            const body = await res.json();
            if (!res.ok) throw new Error(`${res.status} ${path}: ${JSON.stringify(body)}`);
            return body;
          }
          const leaguesBody = await get("/leagues", { include: "country" });
          const leagues = (leaguesBody.data ?? []).map(x => ({
            id: x.id,
            name: x.name,
            country: x.country?.name ?? null,
            active: x.active ?? null
          }));
          const dates = ["2026-10-17","2026-10-18","2026-10-19"];
          const fixtures = [];
          for (const date of dates) {
            const body = await get(`/fixtures/date/${date}`, { include: "league;participants" });
            for (const f of body.data ?? []) {
              fixtures.push({
                id: f.id,
                date,
                name: f.name,
                leagueId: f.league_id,
                league: f.league?.name ?? null,
                participants: (f.participants ?? []).map(p => p.name)
              });
            }
          }
          const out = { generatedAt: new Date().toISOString(), leagues, fixtures };
          await require("node:fs/promises").writeFile(
            "artifacts/provider-spike/sportmonks-access.json",
            JSON.stringify(out, null, 2) + "\n",
            "utf8"
          );
          console.log(JSON.stringify({
            leagues,
            fixtures: fixtures.filter(f =>
              /Ligat|Leumit|Bundesliga|Serie A|Ligue 1/i.test(f.league ?? "")
            )
          }, null, 2));
          NODE

      - name: Print report
        if: always()
        run: |
          if [ -f artifacts/provider-spike/sportmonks.json ]; then
            cat artifacts/provider-spike/sportmonks.json
          fi

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sportmonks-analytics-spike-264101
          path: artifacts/provider-spike
          if-no-files-found: error
          retention-days: 14
