name: Kapiloto V4 Sportmonks Season Roster Capture

on:
  workflow_dispatch:
    inputs:
      league_id:
        description: "Sportmonks league ID"
        required: true
        default: "8"
        type: string
      expected_team_count:
        description: "Fail closed unless the current-season roster has this many teams"
        required: true
        default: "20"
        type: string

permissions:
  contents: read

jobs:
  roster-capture:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: provider-readonly
    timeout-minutes: 5
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Syntax-check capture script
        run: node --check tools/kapiloto-v4-sportmonks-season-roster.mjs

      - name: Capture current-season roster from Sportmonks
        env:
          SPORTMONKS_API_TOKEN: ${{ secrets.SPORTMONKS_API_TOKEN }}
        run: >
          node tools/kapiloto-v4-sportmonks-season-roster.mjs
          --league-id "${{ inputs.league_id }}"
          --expected-team-count "${{ inputs.expected_team_count }}"
          --out artifacts/kapiloto-v4-season-roster

      - name: Print roster report
        if: always()
        run: |
          if [ -f artifacts/kapiloto-v4-season-roster/roster-report.json ]; then
            cat artifacts/kapiloto-v4-season-roster/roster-report.json
          fi

      - name: Upload immutable roster capture
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: kapiloto-v4-sportmonks-season-roster-${{ inputs.league_id }}
          path: artifacts/kapiloto-v4-season-roster
          if-no-files-found: error
          retention-days: 14
